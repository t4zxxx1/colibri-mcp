<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Soluzioni di viaggio</title>
<style>
  body { font: 14px sans-serif; margin: 0; }
  app-solution { display: contents; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .mega { display: none; }
  .chips span { display: inline-block; margin: 4px; padding: 4px; border: 1px solid #ccc; }
  .sol { display: flex; gap: 12px; border: 1px solid #ddd; margin: 6px; padding: 8px; }
</style>
</head>
<body>
<div class="mega" id="mega"></div>
<main>
  <h1>Milano Centrale → Bologna Centrale</h1>
  <div class="chips" id="chips"></div>
  <section class="list" id="list"></section>
</main>
<script>
  // menu enorme nascosto (oltre 8000 nodi) prima dei risultati, come nei portali reali
  const mega = document.getElementById('mega');
  let h = '';
  if (!location.search.includes('nomega')) for (let i = 0; i < 9200; i++) h += '<div class="mi"><span>Voce ' + i + '</span></div>';
  mega.innerHTML = h;
  // 20 chip con pulsanti e testo per lettori di schermo: il gruppo che non va scelto
  const chips = document.getElementById('chips');
  h = '';
  for (let i = 0; i < 20; i++) h += '<span class="chip"><button>' + (i % 2 ? 'Dettagli' : '1 cambio') + '</button><button><span class="sr-only">Mostra informazioni sul cambio di treno</span></button><button><span class="sr-only">Apri dettagli della soluzione</span></button></span>';
  chips.innerHTML = h;
  const list = document.getElementById('list');
  h = '';
  for (let i = 0; i < 10; i++) {
    const dep = '18:' + String(28 + i * 3).padStart(2, '0');
    const arr = '19:' + String(16 + i * 3).padStart(2, '0');
    const ch = i % 3 === 1;
    h += '<app-solution class="ng-star-inserted ' + (ch ? 'with-change' : 'direct') + '">' +
      '<div class="sol ' + (ch ? 'sol--change' : 'sol--direct') + (i === 0 ? ' sol--first' : '') + '">' +
      '<span class="sr-only">Soluzione n. ' + (i + 1) + ' ; partenza ore ' + dep + ' arrivo ore ' + arr + '</span>' +
      '<div aria-hidden="true"' + (location.search.includes('sronly') ? ' style="display:none"' : '') + '><span class="t">' + dep + '</span> <span class="t">' + arr + '</span></div>' +
      '<span class="dur">0h 48min</span>' +
      (ch ? '<button class="chg">1 cambio</button>' : '<span class="tr">Frecciarossa</span>') +
      '<span class="price">' + (19.9 + i).toFixed(2).replace('.', ',') + ' €</span>' +
      '<button onclick="document.title=\'scelta ' + (i + 1) + '\'">Seleziona</button>' +
      '</div></app-solution>';
  }
  list.innerHTML = h;
</script>
</body>
</html>
