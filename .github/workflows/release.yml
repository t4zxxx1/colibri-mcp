name: Release

# Pubblica una nuova versione: aggiorna la versione nei tre package/manifest, poi
#   git tag v0.2.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pubblica la release con il file .mcpb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          awk -v h="## $V" '$0 == h {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then printf '\n---\n\n' >> notes.md; fi
          cat .github/release-notes.md >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/colibri.mcpb --clobber
          else
            gh release create "$TAG" dist/colibri.mcpb --title "Colibri $TAG" --notes-file notes.md
          fi
