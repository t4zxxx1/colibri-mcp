<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="How it works: the AI agent sends many steps in one call to the local Colibri MCP server, which drives Chrome and returns compact text rows or only the diff.">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <path id="out" d="M232 112 C 290 112, 300 112, 362 112"/>
    <path id="out2" d="M638 112 C 700 112, 710 112, 768 112"/>
    <path id="back2" d="M768 220 C 710 220, 700 220, 638 220"/>
    <path id="back" d="M362 220 C 300 220, 290 220, 232 220"/>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, Menlo, monospace; }
    .ring { animation: ring 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    .row { animation: row 6s linear infinite; }
    @keyframes row { 0%,55% { opacity: 0; } 62%,95% { opacity: 1; } 100% { opacity: 0; } }
    .r2 { animation-delay: .25s; } .r3 { animation-delay: .5s; } .r4 { animation-delay: .75s; }
  </style>
  <rect width="1000" height="340" rx="18" fill="#0d1117"/>
  <rect x=".75" y=".75" width="998.5" height="338.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- agent -->
  <g>
    <rect x="32" y="70" width="200" height="190" rx="16" fill="#161b22" stroke="#30363d"/>
    <text x="132" y="106" text-anchor="middle" font-size="17" font-weight="800" fill="#f0f6fc">Your AI agent</text>
    <text x="132" y="132" text-anchor="middle" font-size="13" fill="#8b949e">Claude · Copilot</text>
    <text x="132" y="150" text-anchor="middle" font-size="13" fill="#8b949e">Cursor · Codex · Windsurf</text>
    <rect x="52" y="172" width="160" height="28" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="132" y="191" text-anchor="middle" font-size="12" fill="#67e8f9" class="mono">your subscription</text>
    <text x="132" y="232" text-anchor="middle" font-size="12" fill="#6ee7b7">reads ~600 tokens,</text>
    <text x="132" y="248" text-anchor="middle" font-size="12" fill="#6ee7b7">not a 1,366-token image</text>
  </g>

  <!-- server -->
  <g>
    <rect class="ring" x="356" y="44" width="288" height="250" rx="20" fill="none" stroke="#7c3aed" stroke-width="2" filter="url(#glow)"/>
    <rect x="362" y="50" width="276" height="238" rx="18" fill="url(#core)" stroke="#6366f1"/>
    <text x="500" y="82" text-anchor="middle" font-size="17" font-weight="800" fill="#f0f6fc">Colibri MCP</text>
    <text x="500" y="102" text-anchor="middle" font-size="12" fill="#a5b4fc">local · stdio · Node.js</text>
    <g font-size="12.5">
      <rect x="382" y="118" width="236" height="40" rx="9" fill="#0f172a" stroke="#334155"/>
      <text x="396" y="136" fill="#e2e8f0" font-weight="700">Page → compact rows</text>
      <text x="396" y="151" fill="#94a3b8">fields, state, flags · diff only after acts</text>
      <rect x="382" y="166" width="236" height="40" rx="9" fill="#0f172a" stroke="#334155"/>
      <text x="396" y="184" fill="#e2e8f0" font-weight="700">Jev-style engine (browse_task)</text>
      <text x="396" y="199" fill="#94a3b8">match · calibrate · act or ask</text>
      <rect x="382" y="214" width="236" height="40" rx="9" fill="#0f172a" stroke="#334155"/>
      <text x="396" y="232" fill="#e2e8f0" font-weight="700">Safety gate</text>
      <text x="396" y="247" fill="#94a3b8">!c needs your OK · !x never filled by AI</text>
    </g>
    <text x="500" y="276" text-anchor="middle" font-size="11.5" fill="#a5b4fc">0 API keys · 0 Jev tokens · nothing leaves your PC</text>
  </g>

  <!-- chrome -->
  <g>
    <rect x="768" y="70" width="200" height="190" rx="16" fill="#161b22" stroke="#30363d"/>
    <circle cx="868" cy="120" r="26" fill="none" stroke="#34d399" stroke-width="6"/>
    <circle cx="868" cy="120" r="10" fill="#22d3ee"/>
    <text x="868" y="172" text-anchor="middle" font-size="17" font-weight="800" fill="#f0f6fc">Chrome / Edge</text>
    <text x="868" y="194" text-anchor="middle" font-size="13" fill="#8b949e">dedicated profile</text>
    <text x="868" y="212" text-anchor="middle" font-size="13" fill="#8b949e">your logins stay here</text>
    <text x="868" y="240" text-anchor="middle" font-size="12" fill="#6ee7b7">Playwright, DOM-stable waits</text>
  </g>

  <!-- links -->
  <g stroke-width="2" fill="none" stroke-dasharray="5 6">
    <use href="#out" stroke="#475569"/><use href="#out2" stroke="#475569"/>
    <use href="#back2" stroke="#475569"/><use href="#back" stroke="#475569"/>
  </g>
  <text x="297" y="100" text-anchor="middle" font-size="11.5" fill="#67e8f9">22 steps</text>
  <text x="297" y="140" text-anchor="middle" font-size="11.5" fill="#67e8f9">1 call</text>
  <text x="703" y="100" text-anchor="middle" font-size="11.5" fill="#94a3b8">acts</text>
  <text x="703" y="248" text-anchor="middle" font-size="11.5" fill="#94a3b8">DOM</text>
  <text x="297" y="208" text-anchor="middle" font-size="11.5" fill="#6ee7b7">diff only</text>
  <text x="297" y="248" text-anchor="middle" font-size="11.5" fill="#6ee7b7">~342 tokens</text>

  <g>
    <circle r="6" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" calcMode="linear"><mpath href="#out"/></animateMotion></circle>
    <circle r="6" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.25;0.42;1" calcMode="linear"><mpath href="#out2"/></animateMotion></circle>
    <circle r="6" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.45;0.62;1" calcMode="linear"><mpath href="#back2"/></animateMotion></circle>
    <circle r="6" fill="#34d399" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.65;0.85;1" calcMode="linear"><mpath href="#back"/></animateMotion></circle>
  </g>

  <g class="mono" font-size="11" fill="#6ee7b7">
    <text class="row" x="40" y="292">ok 22/22 · 16 campi impostati come richiesto</text>
    <text class="row r2" x="40" y="308">~ e33 "Provincia" ="Napoli" req</text>
    <text class="row r3" x="40" y="324">~ e34 "Comune" ="Pozzuoli" req col</text>
  </g>
  <g class="mono" font-size="11" fill="#94a3b8">
    <text class="row r2" x="690" y="292">e29 text "Partita IVA" req</text>
    <text class="row r3" x="690" y="308">e31 sel "Codice ATECO" opz:97 req</text>
    <text class="row r4" x="690" y="324">e56 btn "Salva bozza" !c</text>
  </g>
</svg>
