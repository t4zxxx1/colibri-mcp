<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="One line, any agent: install Colibri in Claude Code, OpenAI Codex, Copilot CLI, Gemini CLI, VS Code, Claude Desktop, Cursor and Windsurf with a single command.">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, Menlo, monospace; }
    .s { opacity: 0; animation: slot 18.0s linear infinite; }
    @keyframes slot { 0% { opacity: 0; } 1% { opacity: 1; } 15.17% { opacity: 1; } 16.17%,100% { opacity: 0; } }
    .type { transform-box: fill-box; transform-origin: right center; animation: type 18.0s steps(40,end) infinite; }
    @keyframes type { 0% { transform: scaleX(1); } 7.50%,100% { transform: scaleX(0); } }
    .ok { opacity: 0; animation: ok 18.0s ease-out infinite; }
    @keyframes ok { 0%,8.33% { opacity: 0; } 9.67%,15.17% { opacity: 1; } 16.17%,100% { opacity: 0; } }
    .hl { opacity: 0; animation: hl 18.0s ease-in-out infinite; }
    @keyframes hl { 0%,7.50% { opacity: 0; } 9.17%,15.67% { opacity: 1; } 18.67%,100% { opacity: 0; } }
    .cur { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    .d0 { animation-delay: 0.0s; }
    .d1 { animation-delay: 3.0s; }
    .d2 { animation-delay: 6.0s; }
    .d3 { animation-delay: 9.0s; }
    .d4 { animation-delay: 12.0s; }
    .d5 { animation-delay: 15.0s; }
  </style>
  <rect width="1000" height="420" rx="18" fill="#0d1117"/>
  <rect x=".75" y=".75" width="998.5" height="418.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="500" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="url(#tg)">One line. Any agent.</text>
  <text x="500" y="80" text-anchor="middle" font-size="15" fill="#8b949e">Copy, paste, browse — same server, same 7 tools, no API key, no account.</text>
  <rect x="36" y="100" width="928" height="78" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="56" cy="116" r="5" fill="#f87171"/><circle cx="74" cy="116" r="5" fill="#fbbf24"/><circle cx="92" cy="116" r="5" fill="#34d399"/>
  <g class="s d0">
    <text x="56" y="146" font-size="14" class="mono"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">claude mcp add colibri -- npx -y github:t4zxxx1/colibri-mcp</tspan></text>
    <rect x="74" y="130" width="880" height="22" fill="#161b22" class="type d0"/>
    <text x="56" y="168" font-size="13" class="mono ok d0" fill="#6ee7b7">✓ colibri connected · 7 tools ready</text>
  </g>
  <g class="s d1">
    <text x="56" y="146" font-size="14" class="mono"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">codex mcp add colibri -- npx -y github:t4zxxx1/colibri-mcp</tspan></text>
    <rect x="74" y="130" width="880" height="22" fill="#161b22" class="type d1"/>
    <text x="56" y="168" font-size="13" class="mono ok d1" fill="#6ee7b7">✓ colibri connected · 7 tools ready</text>
  </g>
  <g class="s d2">
    <text x="56" y="146" font-size="14" class="mono"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">copilot mcp add colibri -- npx -y github:t4zxxx1/colibri-mcp</tspan></text>
    <rect x="74" y="130" width="880" height="22" fill="#161b22" class="type d2"/>
    <text x="56" y="168" font-size="13" class="mono ok d2" fill="#6ee7b7">✓ colibri connected · 7 tools ready</text>
  </g>
  <g class="s d3">
    <text x="56" y="146" font-size="14" class="mono"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">gemini mcp add -s user colibri npx -y github:t4zxxx1/colibri-mcp</tspan></text>
    <rect x="74" y="130" width="880" height="22" fill="#161b22" class="type d3"/>
    <text x="56" y="168" font-size="13" class="mono ok d3" fill="#6ee7b7">✓ colibri connected · 7 tools ready</text>
  </g>
  <g class="s d4">
    <text x="56" y="146" font-size="14" class="mono"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">code --add-mcp '{"name":"colibri","command":"npx","args":["-y","github:t4zxxx1/colibri-mcp"]}'</tspan></text>
    <rect x="74" y="130" width="880" height="22" fill="#161b22" class="type d4"/>
    <text x="56" y="168" font-size="13" class="mono ok d4" fill="#6ee7b7">✓ colibri connected · 7 tools ready</text>
  </g>
  <g class="s d5">
    <text x="56" y="146" font-size="14" class="mono"><tspan fill="#34d399">$ </tspan><tspan fill="#8b949e"># Claude Desktop: double-click colibri.mcpb  — done</tspan></text>
    <rect x="74" y="130" width="880" height="22" fill="#161b22" class="type d5"/>
    <text x="56" y="168" font-size="13" class="mono ok d5" fill="#6ee7b7">✓ colibri connected · 7 tools ready</text>
  </g>
